# -------------------------
# Project Settings
# -------------------------
# 분석할 종(species)을 선택합니다: "human" 또는 "mouse"
# 이 설정에 따라 아래 organism_db와 kegg_code가 자동으로 결정됩니다.
species: "human"

# 입력 데이터의 Gene ID 형식을 지정합니다: "ENSEMBL", "ENTREZID", "SYMBOL"
# 생략 시 첫 번째 gene ID 패턴으로 자동 감지합니다.
# featureCounts 출력(ENSEMBL)을 그대로 사용하는 경우: "ENSEMBL"
gene_id_type: "ENSEMBL"

# -------------------------
# File Paths
# -------------------------
count_data_path: "data/raw/airway_scaledcounts.csv"
metadata_path: "data/raw/airway_metadata.csv"
output_dir: "output"

# -------------------------
# Analysis Parameters
# -------------------------
# DE 분석 관련 설정
de_analysis:
  # 사용할 DGE 분석 방법을 선택: "DESeq2", "edgeR", "limma-voom"
  method: "DESeq2"

  # ★★★ 다중 비교를 위한 핵심 설정 ★★★

  # 1. 디자인 공식: 메타데이터의 '그룹' 컬럼을 포함해야 합니다.
  #    예: "~ group" 또는 배치 효과가 있다면 "~ batch + group"
  design_formula: "~ group"
  
  # 2. 그룹 변수: design_formula에 사용된 그룹 컬럼의 이름을 정확히 적어줍니다.
  group_variable: "group"

  # 3. Omnibus Test: true로 설정 시, 모든 그룹 간에 차이가 있는지 1-way ANOVA-like test를 수행합니다.
  #    (DESeq2/edgeR: LRT, limma: F-test)
  #    이 결과는 '{output_dir}/omnibus_test_results.csv' 등으로 저장됩니다.
  run_omnibus_test: true

  # Multi-group result export (run_omnibus_test: true 일 때만 의미 있음)
  # omnibus LRT 통계 + normalized count를 하나의 CSV로 출력
  # CMG-SeqViewer MULTI_GROUP 타입 heatmap/clustering용
  multi_group_export:
    enabled: false

    # 발현량 정규화 방식
    # "normalized": DESeq2 size-factor normalized counts (권장)
    # "vst"       : VST 변환값 (추후 구현 예정 — 현재 설정 시 오류)
    abundance_type: "normalized"

    # gene_symbol 컬럼 포함 여부 (databases[species].organism_db 필요)
    include_gene_symbol: true

    # 샘플 컬럼 그룹 정렬 기준 (이 그룹이 맨 앞, 나머지는 오름차순)
    # null: pairwise_comparisons base 그룹 최빈값으로 자동 감지
    reference_group: null   # 예: "Control", "WT", "ctrl"

    # 선택적 필터링 (null이면 필터 없음)
    filter_padj: null       # 예: 0.05 → padj <= 0.05 유전자만 출력
    filter_basemean: null   # 예: 10   → baseMean >= 10 유전자만 출력

  # 4. Pairwise Comparisons: 실행할 모든 1:1 비교를 [비교군, 기준군] 쌍으로 명시합니다.
  #    Snakemake가 이 목록을 기반으로 각 비교 작업을 생성합니다.
  pairwise_comparisons:
    - ["Acute_1D", "Control"]
    - ["Acute_3D", "Control"]
    - ["Chronic_100uM", "Control"]
    - ["Chronic_200uM", "Control"]
    # 예시: 그룹이 더 있다면 아래처럼 추가
    # - ["Drug_High", "Control"]
    # - ["Drug_Low", "Control"]
    # - ["Drug_High", "Drug_Low"]

  # 유의성 기준 (Adjusted p-value)
  padj_cutoff: 0.05
  # Log2 Fold Change 절대값 기준
  log2fc_cutoff: 1.0

  advanced_options:
    # 1. Pre-filtering: 각 샘플에서 count >= min_count 인 샘플이 min_samples개 이상인 유전자만 유지
    # → 샘플 수에 무관한 기준. rowSums 고정 기준보다 생물학적으로 의미 있음.
    # min_samples: "auto" → 비교 그룹 중 가장 작은 그룹 크기를 자동으로 사용
    prefilter_min_count: 1
    prefilter_min_samples: "auto"

    # 2. Pairwise 비교 시 정규화 방법 선택
    # "subset": 각 비교마다 해당 두 그룹의 샘플만으로 정규화 (독립적, 더 보수적)
    # "global": 전체 샘플을 사용하여 정규화한 후 pairwise 비교 (일관성 있는 정규화)
    pairwise_normalization: "global"

    # 3. PCA/VST 변환 시 실험 디자인 고려 여부 (DESeq2 vst())
    # false: 디자인 고려 (Supervised) → 그룹 간 차이를 더 잘 보여줌 (권장)
    # true: 디자인 무시 (Unsupervised)
    vst_blind: false

    # 4. PCA 계산에 사용할 상위 변동성 유전자 개수
    pca_ntop: 500

# enrichment analysis 관련 설정
enrichment:
  # 분석할 유전자 목록: "total", "up", "down" 중에서 원하는 항목만 남기세요.
  gene_lists: ["total", "up", "down"]
  # 실행할 Gene Ontology 목록: "BP", "CC", "MF" 중에서 원하는 항목만 남기세요.
  go_ontologies: ["BP", "CC", "MF"]
  
  # Enrichment 분석 파라미터
  # Note: pvalue_cutoff와 qvalue_cutoff는 결과 저장시에는 사용되지 않음 (모든 결과 저장)
  #       시각화(dotplot, barplot)에서만 필터링에 사용됨
  pvalue_cutoff: 0.05
  qvalue_cutoff: 0.25
  
  # GO 유전자 세트 크기 제한 (clusterProfiler enrichGO/enrichKEGG 파라미터)
  min_gs_size: 5     # 최소 유전자 세트 크기 (너무 작으면 통계적으로 불안정)
  max_gs_size: 500   # 최대 유전자 세트 크기 (너무 크면 너무 일반적이어서 의미 약함)
  
  # 최소 유전자 개수 필터 (enrichment 결과에서 Count가 이 값 미만인 term 제외)
  min_gene_count: 2  # Count가 1인 경우 등 의미 없는 결과 제외
  
  # 시각화(dotplot, barplot)에 표시할 상위 term 개수
  plot_top_n: 15     # dotplot과 barplot에 표시할 최대 term 개수

# -------------------------
# QC Plots Settings
# -------------------------
qc_plots:
  # Global QC plots (모든 샘플 대상)
  generate_global_qc: true
  
  # Pairwise QC plots (각 비교군별)
  generate_pairwise_qc: true
  
  # 샘플 간 거리 계산 방법: "euclidean", "maximum", "manhattan" 등
  sample_distance_method: "euclidean"
  
  # Top DE genes heatmap에 표시할 유전자 개수
  top_genes_n: 30
  
  # MA plot의 y축 범위 (log2 fold change)
  ma_plot_ylim: [-5, 5]
  
  # Heatmap 클러스터링 옵션
  heatmap_cluster_rows: true
  heatmap_cluster_cols: true

# -------------------------
# Annotation Databases (자동 설정)
# -------------------------
# species 설정에 따라 결정되는 값들이므로 직접 수정할 필요가 없습니다.
databases:
  human:
    organism_db: "org.Hs.eg.db"
    kegg_code: "hsa"
  mouse:
    organism_db: "org.Mm.eg.db"
    kegg_code: "mmu"

# -------------------------
# Plot Aesthetics (시각화 속성)
# -------------------------
plot_aesthetics:
  # Volcano Plot 속성
  volcano:
    title: "Volcano Plot"
    up_color: "#FF5733"      # 상향 조절 유전자 색상
    down_color: "#3375FF"    # 하향 조절 유전자 색상
    base_color: "grey"       # 그 외 유전자 색상
    point_size: 2.5          # 점 크기
    label_top_n: 0          # 상위 N개 유전자에 라벨 표시 (0이면 표시 안함)
    base_font_size: 14       # 기본 폰트 크기

  # Dot Plot (GO & KEGG) 속성
  dotplot:
    x_axis_variable: "GeneRatio" # Dot plot의 x축에 사용할 변수를 선택: "FoldEnrichment" 또는 "GeneRatio"
    show_n_categories: 15    # 표시할 상위 카테고리 개수
    font_size: 12            # 폰트 크기
    low_color: "#FFC300"     # p-value가 낮을 때의 색상 (진한 색)
    high_color: "#C70039"    # p-value가 높을 때의 색상 (연한 색)

# -------------------------
# GO Bar Plot Settings
# -------------------------
go_barplot:
  # 플롯에 표시할 상위 GO Term 개수
  top_n: 10
  # 종합 플롯에 포함할 Ontology 목록: "BP", "CC", "MF" 중 선택
  namespaces: ["BP", "CC", "MF"]
  # 각 Ontology에 대한 막대 색상
  colors:
    BP: "#E57373"  # Biological Process
    CC: "#64B5F6"  # Cellular Component
    MF: "#81C784"  # Molecular FunctionS

# -------------------------
# Export Options
# -------------------------
export:
  # true로 설정하면 .xlsx 엑셀 파일도 함께 생성합니다.
  export_to_excel: true

  # ──────────────────────────────────────────────────────────────────
  # cmg-seqviewer 내보내기 (강력 권장, 선택 사항)
  #
  # true로 설정하면 파이프라인 완료 후 아래 파일을 자동 생성합니다:
  #   output/{project_id}/seqviewer/
  #     ├── metadata.json          ← 앱 자동 인식용 메타데이터
  #     └── datasets/
  #         ├── *_de_*.parquet     ← DE 결과 (표준 컬럼명)
  #         └── *_go_*.parquet     ← GO/KEGG 결과 (표준 컬럼명)
  #
  # 생성된 파일을 앱의 data/ 폴더에 복사하면 재시작 시 자동 인식됩니다.
  # 자세한 내용: pipeline-integration.md
  # ──────────────────────────────────────────────────────────────────
  seqviewer: false

# -------------------------
# Upload Options
# -------------------------
upload:
  # true로 설정하면 파이프라인 완료 후 rclone으로 Google Drive에 자동 업로드합니다.
  # rclone이 설치되어 있어야 하며, remote가 미리 설정되어 있어야 합니다.
  # 설정 확인: rclone listremotes
  gdrive: true

  # rclone remote 이름 (rclone listremotes 로 확인)
  remote: "gd_pargilbong:"

  # Google Drive 내 업로드할 상위 폴더 이름
  # 실제 업로드 경로: {remote}{dest_folder}/{output_dir 폴더명}/
  # 예: gd_pargilbong:RNA-Seq_Results/mouse-h2o2-neuron-2026/
  dest_folder: "CMG_folder/Data/01_RNA-SEQ"

