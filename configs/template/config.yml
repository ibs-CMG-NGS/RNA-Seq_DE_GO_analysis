# -------------------------
# Project Settings
# -------------------------
# 분석할 종(species)을 선택합니다: "human" 또는 "mouse"
# 이 설정에 따라 아래 organism_db와 kegg_code가 자동으로 결정됩니다.
species: "human"

# 입력 데이터의 Gene ID 형식을 지정합니다: "ENSEMBL", "ENTREZID", "SYMBOL"
# 생략 시 첫 번째 gene ID 패턴으로 자동 감지합니다.
# featureCounts 출력(ENSEMBL)을 그대로 사용하는 경우: "ENSEMBL"
gene_id_type: "ENSEMBL"

# -------------------------
# File Paths
# -------------------------
count_data_path: "data/raw/airway_scaledcounts.csv"
metadata_path: "data/raw/airway_metadata.csv"
output_dir: "output"

# -------------------------
# Analysis Parameters
# -------------------------
# DE 분석 관련 설정
de_analysis:
  # 사용할 DGE 분석 방법을 선택: "DESeq2", "edgeR", "limma-voom"
  method: "DESeq2"

  # ★★★ 다중 비교를 위한 핵심 설정 ★★★

  # 1. 디자인 공식: 메타데이터의 '그룹' 컬럼을 포함해야 합니다.
  #    예: "~ group" 또는 배치 효과가 있다면 "~ batch + group"
  design_formula: "~ group"
  
  # 2. 그룹 변수: design_formula에 사용된 그룹 컬럼의 이름을 정확히 적어줍니다.
  group_variable: "group"

  # 3. Omnibus Test: true로 설정 시, 모든 그룹 간에 차이가 있는지 1-way ANOVA-like test를 수행합니다.
  #    (DESeq2/edgeR: LRT, limma: F-test)
  #    이 결과는 '{output_dir}/omnibus_test_results.csv' 등으로 저장됩니다.
  run_omnibus_test: true

  # Multi-group result export (run_omnibus_test: true 일 때만 의미 있음)
  # omnibus LRT 통계 + normalized count를 하나의 CSV로 출력
  # CMG-SeqViewer MULTI_GROUP 타입 heatmap/clustering용
  multi_group_export:
    enabled: false

    # 발현량 정규화 방식
    # "normalized": DESeq2 size-factor normalized counts (권장)
    # "vst"       : VST 변환값 (추후 구현 예정 — 현재 설정 시 오류)
    abundance_type: "normalized"

    # gene_symbol 컬럼 포함 여부 (databases[species].organism_db 필요)
    include_gene_symbol: true

    # 샘플 컬럼 그룹 정렬 기준 (이 그룹이 맨 앞, 나머지는 오름차순)
    # null: pairwise_comparisons base 그룹 최빈값으로 자동 감지
    reference_group: null   # 예: "Control", "WT", "ctrl"

    # 선택적 필터링 (null이면 필터 없음)
    filter_padj: null       # 예: 0.05 → padj <= 0.05 유전자만 출력
    filter_basemean: null   # 예: 10   → baseMean >= 10 유전자만 출력

  # ──────────────────────────────────────────────────────────────────
  # Time-series 분석 (maSigPro) — 시간 경과에 따른 발현 궤적(trajectory) 검정
  # count 기반 회귀(negative binomial GLM)로 적은 replicate/time point에서도
  # 안정적으로 동작하도록 설계된 maSigPro를 사용. 시간을 명시적 숫자 컬럼으로
  # 요구합니다 (문자열 그룹명에서 자동 파싱하지 않음).
  # ──────────────────────────────────────────────────────────────────
  time_series:
    enabled: false

    # 메타데이터의 숫자형 time 컬럼명 (신규 컬럼 필요 — 예: 0, 1, 3, 7 등)
    time_variable: "time"

    # (선택) 시계열에 쓸 샘플을 특정 그룹(조건)만으로 제한합니다. 한 프로젝트 안에서
    # 시간축이 다른 여러 시계열(예: acute 0/1/3일 vs chronic 0/24/48시간)을 공존시킬 때
    # 유용 — 이 경우 Snakemake 기본 슬롯(time_series.enabled)은 하나만 지원하므로,
    # 두 번째 이후 시계열은 파생 config로 직접 스크립트를 실행해야 함(coexpression_modules
    # 서브셋 분석과 동일 패턴). null이면 metadata의 전체 그룹을 사용합니다.
    include_groups: null   # 예: ["Control", "Acute_1D", "Acute_3D"]

    # 여러 시리즈(예: 부위/유전자형)를 동시에 비교할 때 메타데이터의 범주형 컬럼명
    # null이면 단일 시리즈로 취급
    series_variable: null

    # 회귀 다항식 차수. "auto" = min(시리즈별 고유 time point 개수 - 1, 2)
    # 시리즈별로 time point가 3개 미만이면 실행 시 에러로 중단됩니다.
    degree: "auto"

    # 유의성 기준 (BH-adjusted p-value)
    q_value: 0.05
    # R-squared 기준 (회귀 모델이 설명하는 분산 비율)
    rsq_cutoff: 0.6

    # 유의 유전자를 발현 패턴별로 묶을 클러스터 개수 (see.genes)
    pattern_k: 6

    # true면 결과를 CMG-SeqViewer용 parquet + staging JSON으로도 내보냄
    export_seqviewer: true

    # true면 패턴 클러스터별(+전체) GO/KEGG enrichment를 수행해
    # final_go_results.xlsx(+개별 CSV)를 time_series/ 폴더에 생성
    enrichment_enabled: true

  # ──────────────────────────────────────────────────────────────────
  # Coexpression module 분석 — omnibus test로 걸러진 유의 유전자 서브셋에 대해서만
  # 발현 패턴 기반 클러스터링(DEGreport::degPatterns) 수행.
  # run_omnibus_test: true 일 때만 의미 있음.
  # 전체 transcriptome 규모의 WGCNA/CEMiTool은 다루지 않습니다 (샘플 수가 적을 때
  # 불안정하여 별도 단계로 보류됨).
  # ──────────────────────────────────────────────────────────────────
  coexpression_modules:
    enabled: false

    # (선택) 클러스터링에 쓸 샘플을 특정 그룹(조건)만으로 제한합니다.
    # 유의 유전자 목록은 그대로 전체 그룹 기준 omnibus 결과를 사용하고,
    # VST 계산 + degPatterns 클러스터링에 들어가는 "샘플"만 여기 지정한
    # 그룹으로 제한합니다 (실험적으로 함께 묶는 게 의미 있는 조건들만 선택).
    # null이면 기존과 동일하게 metadata의 전체 그룹을 사용합니다.
    include_groups: null   # 예: ["Control", "H2O2", "H2O2+KDS"]

    # (선택) 같은 프로젝트 안에서 include_groups로 여러 서브셋 분석을 각각 별도
    # seqviewer 데이터셋으로 내보낼 때, alias/parquet 파일명/staging 파일명이
    # 서로 겹치지 않도록 붙이는 라벨입니다. null이면 기존과 동일한 파일명(단일 분석용).
    variant_label: null    # 예: "Ctrl-H2O2-KDS"

    # 유의 유전자 필터 기준. null이면 위 padj_cutoff 재사용
    padj_cutoff: null

    # 유의 유전자가 이보다 적으면 분석을 건너뜁니다 (경고 후 정상 종료)
    min_genes: 10

    # DEGreport::degPatterns의 minc 파라미터 오버라이드
    # 기본값(15)은 유의 유전자가 수십 개 수준일 때 클러스터를 조용히 병합/폐기하므로
    # 이 스케일에 맞춰 낮게 설정합니다.
    min_cluster_size: 5

    # true면 결과를 CMG-SeqViewer용 parquet + staging JSON으로도 내보냄
    export_seqviewer: true

    # true면 모듈별(+전체) GO/KEGG enrichment를 수행해
    # final_go_results.xlsx(+개별 CSV)를 coexpression_modules/ 폴더에 생성
    enrichment_enabled: true

  # 4. Pairwise Comparisons: 실행할 모든 1:1 비교를 [비교군, 기준군] 쌍으로 명시합니다.
  #    Snakemake가 이 목록을 기반으로 각 비교 작업을 생성합니다.
  pairwise_comparisons:
    - ["Acute_1D", "Control"]
    - ["Acute_3D", "Control"]
    - ["Chronic_100uM", "Control"]
    - ["Chronic_200uM", "Control"]
    # 예시: 그룹이 더 있다면 아래처럼 추가
    # - ["Drug_High", "Control"]
    # - ["Drug_Low", "Control"]
    # - ["Drug_High", "Drug_Low"]

  # 유의성 기준 (Adjusted p-value)
  padj_cutoff: 0.05
  # Log2 Fold Change 절대값 기준
  log2fc_cutoff: 1.0

  advanced_options:
    # 1. Pre-filtering: 각 샘플에서 count >= min_count 인 샘플이 min_samples개 이상인 유전자만 유지
    # → 샘플 수에 무관한 기준. rowSums 고정 기준보다 생물학적으로 의미 있음.
    # min_samples: "auto" → 비교 그룹 중 가장 작은 그룹 크기를 자동으로 사용
    prefilter_min_count: 1
    prefilter_min_samples: "auto"

    # 2. Pairwise 비교 시 정규화 방법 선택
    # "subset": 각 비교마다 해당 두 그룹의 샘플만으로 정규화 (독립적, 더 보수적)
    # "global": 전체 샘플을 사용하여 정규화한 후 pairwise 비교 (일관성 있는 정규화)
    pairwise_normalization: "global"

    # 3. PCA/VST 변환 시 실험 디자인 고려 여부 (DESeq2 vst())
    # false: 디자인 고려 (Supervised) → 그룹 간 차이를 더 잘 보여줌 (권장)
    # true: 디자인 무시 (Unsupervised)
    vst_blind: false

    # 4. PCA 계산에 사용할 상위 변동성 유전자 개수
    pca_ntop: 500

# enrichment analysis 관련 설정
enrichment:
  # 분석할 유전자 목록: "total", "up", "down" 중에서 원하는 항목만 남기세요.
  gene_lists: ["total", "up", "down"]
  # 실행할 Gene Ontology 목록: "BP", "CC", "MF" 중에서 원하는 항목만 남기세요.
  go_ontologies: ["BP", "CC", "MF"]
  
  # Enrichment 분석 파라미터
  # Note: pvalue_cutoff와 qvalue_cutoff는 결과 저장시에는 사용되지 않음 (모든 결과 저장)
  #       시각화(dotplot, barplot)에서만 필터링에 사용됨
  pvalue_cutoff: 0.05
  qvalue_cutoff: 0.25
  
  # GO 유전자 세트 크기 제한 (clusterProfiler enrichGO/enrichKEGG 파라미터)
  min_gs_size: 5     # 최소 유전자 세트 크기 (너무 작으면 통계적으로 불안정)
  max_gs_size: 500   # 최대 유전자 세트 크기 (너무 크면 너무 일반적이어서 의미 약함)
  
  # 최소 유전자 개수 필터 (enrichment 결과에서 Count가 이 값 미만인 term 제외)
  min_gene_count: 2  # Count가 1인 경우 등 의미 없는 결과 제외
  
  # 시각화(dotplot, barplot)에 표시할 상위 term 개수
  plot_top_n: 15     # dotplot과 barplot에 표시할 최대 term 개수

  # ──────────────────────────────────────────────────────────────────
  # GO term clustering (up/down 세트에만 적용, "total"은 제외)
  # FDR/fold-enrichment로 유의 term만 추린 뒤, term간 유전자 중복도(Jaccard)
  # 기반으로 clusterProfiler::pairwise_termsim() + enrichplot::treeplot()로
  # 클러스터링/시각화. GO(BP/CC/MF)에만 적용되고 KEGG에는 적용되지 않음.
  # ──────────────────────────────────────────────────────────────────
  term_cluster:
    enabled: true
    fdr_cutoff: 0.05              # p.adjust 기준
    fold_enrichment_cutoff: 2.0   # GeneRatio / BgRatio 기준

    # 기본 모드: Jaccard 유사도 임계값으로 클러스터를 나눔(CMG-SeqViewer 자체 클러스터링
    # 기본값과 동일 — cmg-seqviewer/docs/UPSTREAM_CLUSTERED_GO_FORMAT.md §3 참고).
    # 이 값 이상 유사한 term끼리 같은 클러스터로 묶이고, 나머지는 싱글톤 처리됨.
    # 명시적으로 null로 두면 대신 n_clusters(고정 k)로 자른다(하위호환).
    similarity_cutoff: 0.7
    n_clusters: 5                 # similarity_cutoff가 null일 때만 사용하는 고정 클러스터 개수
    hclust_method: average        # CMG-SeqViewer 기본값과 동일(average linkage)

    # CSV/CMG용 엑셀(final_go_clustered_results.xlsx)은 이 값과 무관하게 유의 term
    # 전체(모든 클러스터 + 싱글톤)를 담는다. 아래 값은 PNG treeplot 시각화에서 대표로
    # 보여줄 term 개수 상한일 뿐이다(숫자만, null/전체 표시 불가). treeplot()이 term이 많아질수록
    # 처리 시간이 급격히 늘고(100개일 때 약 1분) 200~500개 구간에서 내부 에러도 발생하므로
    # 너무 크게 잡지 않는 것을 권장(실측 기준 100 이하 권장).
    show_top_n: 30

  # ──────────────────────────────────────────────────────────────────
  # GO Slim rollup (up/down 세트에만 적용, "total"은 제외)
  # FDR/fold-enrichment로 유의 term만 추린 뒤 clusterProfiler::gofilter()로 GO DAG level
  # 기준 상위 범주만 남겨서, 세부 term에 파묻히기 전에 "이 실험이 어떤 상위 생물학적
  # 프로세스를 주로 건드리는가"를 bar chart 한 장으로 파악한다(go_slim_overview_{ont}.png).
  # ──────────────────────────────────────────────────────────────────
  go_slim:
    enabled: true
    fdr_cutoff: 0.05              # p.adjust 기준
    fold_enrichment_cutoff: 2.0   # GeneRatio / BgRatio 기준
    # GO DAG level. 낮을수록(예: 2) term이 더 적고 더 추상적, 데이터셋에 따라 0개로
    # 비어버릴 수 있음(실측 확인). level 3을 시작점으로 권장하되, 결과 term이 너무
    # 많거나 적으면 조정할 것 — 문서 상 수치(레벨당 term 개수)는 데이터셋마다 편차가 큼.
    level: 3

  # ──────────────────────────────────────────────────────────────────
  # rrvgo 의미론적(semantic) 축약 (up/down 세트에만 적용, "total"은 제외)
  # FDR/fold-enrichment로 유의 term 전체를 대상으로 GO DAG 의미 거리 기반 축약을 계산해
  # parentTerm 라벨(treemap/scatter plot)을 부여한다. term_cluster(Jaccard)의 입력이나
  # CMG 엑셀 내보내기용 유의 term 목록을 줄이는 데는 쓰이지 않음 — 별도 병렬 트랙으로
  # CSV(go_rrvgo_{geneset}_{ontology}.csv) + 시각화만 추가로 생성한다.
  # 주의: term이 많으면(500개 안팎) 유사도 계산에 term당 약 0.1초, 즉 조합당 40~50초
  # 정도 걸릴 수 있음(실측). 프로젝트가 크면 pair × geneset × ontology 조합 수만큼 누적됨.
  # ──────────────────────────────────────────────────────────────────
  rrvgo:
    enabled: true
    fdr_cutoff: 0.05              # p.adjust 기준
    fold_enrichment_cutoff: 2.0   # GeneRatio / BgRatio 기준
    method: Rel                   # Resnik / Lin / Rel / Jiang / Wang (Rel 권장 시작점)
    threshold: 0.7                # 낮을수록 공격적으로 축약(0.5~0.9 사이에서 조정)
    score_by: fdr                 # "fdr"(=-log10 FDR, 통계적으로 강한 term을 대표로) 또는 "count"

  # ──────────────────────────────────────────────────────────────────
  # Cross-Condition GO 비교 (docs/plan_cross_condition_go.md 참고)
  # pairwise_comparisons가 3개 이상일 때(dose-response, time-course 등) 각 비교의
  # GO enrichment 결과를 서로 대조해 "여러 조건에서 공통으로 조절되는 term",
  # "그룹 간 방향 역전", "특정 조건에만 있는 term"을 찾는다. 기본은 비활성 —
  # 조건이 2개뿐이면 의미가 없고, 대부분의 project가 아직 groups/exclusives 같은
  # 프로젝트별 설정을 필요로 하기 때문에 명시적으로 켜야 한다.
  # 11_run_group_enrichment.R(ts/coexpr)과는 다른 축이다 — 이쪽은 "독립적으로 실행된
  # pairwise 비교들" 사이를 비교하고, 그쪽은 "한 실험설계 안의 그룹(cluster/module)"을 다룬다.
  # ──────────────────────────────────────────────────────────────────
  cross_condition:
    enabled: false
    conditions: null              # null이면 pairwise_comparisons 전체({compare}_vs_{base}) 사용
    go_ontologies: [BP]           # GO ontology 외에 "KEGG"도 추가 가능(예: [BP, KEGG]) —
                                   # KEGG는 term 수가 적어 아래 semantic_filtering은 자동 생략됨
    fdr_cutoff: 0.05              # p.adjust 기준
    fold_enrichment_cutoff: 2.0   # GeneRatio / BgRatio 기준
    min_conditions_common: null   # null이면 round(조건 수 * 0.75)
    sparsity_warn_threshold: 20   # 조건×방향 유의 term 수가 이 미만이면 경고 로그
    gene_overlap_jaccard_warn: 0.3  # 방향 역전 term의 gene Jaccard가 이 미만이면 low_overlap 플래그

    # 방향 역전/혼재 분석용 상위 그룹 정의. 예: time-course면 early/late, dose-response면
    # low/high dose. 비워두면(={}) 방향 역전/혼재 분석은 건너뛰고 공통 term 분석만 수행.
    groups: {}
    # groups: {early: [cond_A, cond_B], late: [cond_C, cond_D]}

    # [group_A, group_B, 방향] — group_A에서 해당 방향, group_B에서 반대 방향인 term을 탐지
    flips: []
    # flips: [[early, late, UP], [early, late, DOWN]]

    # 특정 조건 조합에만(or에는 없이) 나타나는 term
    exclusives: []
    # exclusives:
    #   - label: early_only_up
    #     target: [cond_A, cond_B]
    #     absent: [cond_C, cond_D]
    #     direction: UP

    visualization:
      enabled: true
      dotplot_max_terms: 40      # 후보 term이 이 값 초과면 dot plot 대신 heatmap으로 자동 전환
      cluster_terms: true        # 조건별 signed -log10(FDR) 패턴이 비슷한 GO term끼리 축에서
                                  # 인접하도록 묶음(heatmap은 덴드로그램도 함께 표시). false면
                                  # 기존처럼 유의성(FDR) 순으로만 정렬
      cluster_method: average    # hclust 연결 방식(average/complete/ward.D2 등)

    # common_strict(UP/DOWN 각각) 결과 term_id 목록에 rrvgo를 재적용해 의미적으로 중복되는
    # term을 하나의 대표(parent) term으로 축약한다("Semantic Filtered" dot plot/heatmap에 사용).
    # rrvgo 원본 인자(method/threshold)는 기본적으로 enrichment.rrvgo 설정을 그대로 재사용하고,
    # 여기서 다르게 쓰고 싶을 때만 명시적으로 덮어쓴다. KEGG에는 적용되지 않음(term 수가 적어
    # 의미 축약의 실익이 낮음).
    semantic_filtering:
      enabled: true
      method: null      # null이면 enrichment.rrvgo.method 사용
      threshold: null   # null이면 enrichment.rrvgo.threshold 사용

# -------------------------
# QC Plots Settings
# -------------------------
qc_plots:
  # Global QC plots (모든 샘플 대상)
  generate_global_qc: true
  
  # Pairwise QC plots (각 비교군별)
  generate_pairwise_qc: true
  
  # 샘플 간 거리 계산 방법: "euclidean", "maximum", "manhattan" 등
  sample_distance_method: "euclidean"
  
  # Top DE genes heatmap에 표시할 유전자 개수
  top_genes_n: 30
  
  # MA plot의 y축 범위 (log2 fold change)
  ma_plot_ylim: [-5, 5]
  
  # Heatmap 클러스터링 옵션
  heatmap_cluster_rows: true
  heatmap_cluster_cols: true

# -------------------------
# Annotation Databases (자동 설정)
# -------------------------
# species 설정에 따라 결정되는 값들이므로 직접 수정할 필요가 없습니다.
databases:
  human:
    organism_db: "org.Hs.eg.db"
    kegg_code: "hsa"
  mouse:
    organism_db: "org.Mm.eg.db"
    kegg_code: "mmu"
  rat:
    organism_db: "org.Rn.eg.db"
    kegg_code: "rno"

# -------------------------
# Plot Aesthetics (시각화 속성)
# -------------------------
plot_aesthetics:
  # Volcano Plot 속성
  volcano:
    title: "Volcano Plot"
    up_color: "#FF5733"      # 상향 조절 유전자 색상
    down_color: "#3375FF"    # 하향 조절 유전자 색상
    base_color: "grey"       # 그 외 유전자 색상
    point_size: 2.5          # 점 크기
    label_top_n: 0          # 상위 N개 유전자에 라벨 표시 (0이면 표시 안함)
    base_font_size: 14       # 기본 폰트 크기

  # Dot Plot (GO & KEGG) 속성
  dotplot:
    x_axis_variable: "GeneRatio" # Dot plot의 x축에 사용할 변수를 선택: "FoldEnrichment" 또는 "GeneRatio"
    show_n_categories: 15    # 표시할 상위 카테고리 개수
    font_size: 12            # 폰트 크기
    low_color: "#FFC300"     # p-value가 낮을 때의 색상 (진한 색)
    high_color: "#C70039"    # p-value가 높을 때의 색상 (연한 색)

# -------------------------
# GO Bar Plot Settings
# -------------------------
go_barplot:
  # 플롯에 표시할 상위 GO Term 개수
  top_n: 10
  # 종합 플롯에 포함할 Ontology 목록: "BP", "CC", "MF" 중 선택
  namespaces: ["BP", "CC", "MF"]
  # 각 Ontology에 대한 막대 색상
  colors:
    BP: "#E57373"  # Biological Process
    CC: "#64B5F6"  # Cellular Component
    MF: "#81C784"  # Molecular FunctionS

# -------------------------
# Export Options
# -------------------------
export:
  # true로 설정하면 .xlsx 엑셀 파일도 함께 생성합니다.
  export_to_excel: true

  # ──────────────────────────────────────────────────────────────────
  # cmg-seqviewer 내보내기 (강력 권장, 선택 사항)
  #
  # true로 설정하면 파이프라인 완료 후 아래 파일을 자동 생성합니다:
  #   output/{project_id}/seqviewer/
  #     ├── metadata.json          ← 앱 자동 인식용 메타데이터
  #     └── datasets/
  #         ├── *_de_*.parquet     ← DE 결과 (표준 컬럼명)
  #         └── *_go_*.parquet     ← GO/KEGG 결과 (표준 컬럼명)
  #
  # 생성된 파일을 앱의 data/ 폴더에 복사하면 재시작 시 자동 인식됩니다.
  # 자세한 내용: pipeline-integration.md
  # ──────────────────────────────────────────────────────────────────
  seqviewer: true

# -------------------------
# Upload Options
# -------------------------
upload:
  # true로 설정하면 파이프라인 완료 후 rclone으로 Google Drive에 자동 업로드합니다.
  # rclone이 설치되어 있어야 하며, remote가 미리 설정되어 있어야 합니다.
  # 설정 확인: rclone listremotes
  gdrive: true

  # rclone remote 이름 (rclone listremotes 로 확인)
  remote: "gd_pargilbong:"

  # Google Drive 내 업로드할 상위 폴더 이름
  # 실제 업로드 경로: {remote}{dest_folder}/{output_dir 폴더명}/
  # 예: gd_pargilbong:RNA-Seq_Results/mouse-h2o2-neuron-2026/
  dest_folder: "CMG_folder/Data/01_RNA-SEQ"

